<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社長メシ KPI Dashboard</title>
<style>
  :root{
    --bg:#fafafa; --surface:#fff; --text:#1a1a1a; --gray:#767676; --border:#e3e0dc;
    --accent:#d9631e; --accent-tint:#fdf0e6; --red:#b3261e; --green:#1e7a3d;
    --green-bg:#e9f7ee; --red-bg:#fdeceb;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;background:var(--bg);color:var(--text);padding:24px;}
  h1{font-size:19px;color:var(--accent);margin:0 0 4px;}
  h2{font-size:14px;margin:0 0 10px;}
  .sub{font-size:12px;color:var(--gray);margin-bottom:20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:16px;max-width:960px;}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  label{font-size:12px;color:var(--gray);font-weight:700;width:120px;flex-shrink:0;}
  input,select{border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;flex:1;font-family:inherit;}
  button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;}
  button:hover{opacity:.9;}
  button.ghost{background:transparent;color:var(--red);border:1px solid var(--red);padding:4px 10px;font-size:11px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;}
  th{color:var(--gray);font-weight:700;}
  .status{font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:12px;max-width:960px;}
  .status.ok{background:var(--green-bg);color:var(--green);}
  .status.err{background:var(--red-bg);color:var(--red);}
  .status.loading{background:#f2f2f2;color:var(--gray);}
  .switch-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--accent-tint);color:var(--accent);}
  .note{font-size:11px;color:var(--gray);margin-bottom:10px;}

  .kpi-group-label{font-size:11px;font-weight:800;color:var(--gray);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px;}
  .kpi-group-label:first-of-type{margin-top:2px;}
  .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:6px;}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-height:88px;}
  .kpi-grid-primary .kpi-card{border-left:3px solid var(--accent);}
  .kpi-grid-cpa .kpi-card{padding:10px 14px;min-height:64px;background:#fbfaf9;}
  .kpi-label{font-size:11px;color:var(--gray);font-weight:700;}
  .kpi-value{font-size:22px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;margin-top:4px;}
  .kpi-grid-cpa .kpi-value{font-size:17px;}
  .kpi-value.dim{color:var(--gray);font-size:16px;}
  .kpi-grid-cpa .kpi-value.dim{font-size:14px;}

  .cost-row{display:flex;gap:12px;flex-wrap:wrap;}
  .cost-card{flex:1;min-width:130px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .cost-card.total{background:var(--accent-tint);}
  .cost-label{font-size:11px;color:var(--gray);font-weight:700;}
  .cost-value{font-size:16px;font-weight:800;margin-top:4px;}

  .toggle-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .toggle-btn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:700;color:var(--text);cursor:pointer;}
  .toggle-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .chart-svg{width:100%;height:auto;display:block;}

  .funnel{display:flex;gap:0;}
  .funnel-stage{flex:1;text-align:center;}
  .funnel-box{background:var(--accent-tint);border:1px solid var(--accent);border-radius:10px;padding:14px 6px;margin:0 4px;}
  .funnel-name{font-size:11px;color:var(--gray);font-weight:700;}
  .funnel-num{font-size:19px;font-weight:800;color:var(--accent);margin-top:4px;}
  .funnel-arrow{flex:0 0 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--gray);font-weight:700;}

  .app{display:flex;align-items:flex-start;gap:24px;}
  .sidebar{width:220px;flex-shrink:0;position:sticky;top:24px;}
  .sidebar .card{padding:10px;}
  .main{flex:1;min-width:0;}

  .nav-row{display:flex;flex-direction:column;gap:2px;}
  .nav-btn{display:block;width:100%;text-align:left;border:none;border-left:3px solid transparent;background:transparent;border-radius:8px;padding:10px 12px;font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;}
  .nav-btn:hover{background:var(--bg);}
  .nav-btn.active{background:var(--accent-tint);border-left-color:var(--accent);color:var(--accent);}

  .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:70vh;}
  table.data-table{width:auto;min-width:100%;border-collapse:collapse;font-size:12px;}
  table.data-table th,table.data-table td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);}
  table.data-table th:first-child,table.data-table td:first-child{position:sticky;left:0;background:var(--surface);text-align:left;font-weight:700;z-index:1;border-right:1px solid var(--border);}
  table.data-table thead th{position:sticky;top:0;background:var(--surface);z-index:2;font-weight:800;border-bottom:2px solid var(--border);}
  table.data-table thead th:first-child{z-index:3;}
  table.data-table tr.rate-row td{color:var(--gray);font-size:11px;}
  table.data-table td.total-col,table.data-table th.total-col{background:var(--accent-tint);font-weight:800;}
  /* 月別KPI目標タブ：ラベル列の右隣に固定した「合計」列。ラベル列の幅を固定してleftをそろえる */
  table.targets-table th:first-child,table.targets-table td:first-child{width:210px;min-width:210px;max-width:210px;white-space:normal;}
  table.targets-table th:nth-child(2),table.targets-table td:nth-child(2){position:sticky;left:210px;z-index:1;}
  table.targets-table thead th:nth-child(2){z-index:3;}

  .admin-bar{display:flex;align-items:center;gap:14px;}
  .admin-bar-text{display:flex;flex-direction:column;gap:2px;}
  .admin-bar-label{font-size:13px;font-weight:800;}
  .admin-bar-desc{font-size:11px;color:var(--gray);}
  .switch{position:relative;display:inline-block;width:38px;height:21px;flex-shrink:0;}
  .switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1;}
  .switch-track{position:absolute;inset:0;background:var(--border);border-radius:999px;transition:background .15s;}
  .switch-thumb{position:absolute;top:2px;left:2px;width:17px;height:17px;background:#fff;border-radius:50%;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .switch input:checked + .switch-track{background:var(--accent);}
  .switch input:checked + .switch-track + .switch-thumb{left:19px;}
</style>
</head>
<body>

<h1>社長メシ KPI Dashboard <span class="badge">実データ接続版</span></h1>
<div class="sub">Worker: <code id="workerUrlLabel"></code></div>

<div id="statusArea"></div>

<div class="app">
<div class="sidebar">
  <div class="card" id="fiscalYearCard" style="display:none;">
    <label style="font-size:11px;color:var(--gray);font-weight:700;display:block;margin-bottom:4px;">年度</label>
    <select id="fiscalYearSelect" style="width:100%;"></select>
  </div>
  <div class="card">
    <div class="nav-row" id="navRow"></div>
  </div>
</div>
<div class="main">

<div class="card" id="tablePageCard" style="display:none;">
  <h2 id="tablePageTitle"></h2>
  <div class="note" id="activeFilterNote" style="display:none;"></div>
  <div class="row" id="monthSelectorRow" style="display:none;max-width:320px;">
    <label>対象月</label>
    <select id="monthSelector"></select>
  </div>
  <div id="tablePageContent"></div>
</div>

<div class="card" id="dashboardCard" style="display:none;">
  <h2>年度サマリー <span id="fiscalYearLabel" style="color:var(--gray);font-weight:400;"></span></h2>
  <div class="note" id="dashboardNote"></div>
  <div id="dashboardGraduationYearRow"></div>
  <div class="kpi-group-label">主要実績</div>
  <div class="kpi-grid kpi-grid-primary" id="kpiGridPrimary"></div>
  <div class="kpi-group-label">CPA（獲得単価）</div>
  <div class="kpi-grid kpi-grid-cpa" id="kpiGridCpa"></div>
</div>

<div class="card" id="costSummaryCard" style="display:none;">
  <h2>コスト内訳</h2>
  <div class="cost-row" id="costRow"></div>
</div>

<div class="card" id="chartCard" style="display:none;">
  <h2>月次推移</h2>
  <div id="chartCardBody"></div>
</div>

<div class="card" id="funnelCard" style="display:none;">
  <h2>ファネル（年度累計・ユニーク）</h2>
  <div class="funnel" id="funnelRow"></div>
</div>

<div id="settingsCard" style="display:none;">

<div class="card">
  <h2>設定</h2>
  <div class="admin-bar">
    <label class="switch">
      <input type="checkbox" id="adminToggle">
      <span class="switch-track"></span>
      <span class="switch-thumb"></span>
    </label>
    <div class="admin-bar-text">
      <div class="admin-bar-label" id="adminBarLabel">管理者モード：OFF（閲覧のみ）</div>
      <div class="admin-bar-desc">画面を再読み込みすると自動的にOFFへ戻ります。初期版では認証なし。</div>
    </div>
  </div>
  <div class="toggle-row" id="settingsTabRow" style="margin:14px 0 0;"></div>
</div>

<div class="card" id="settingsTabContent"></div>

</div>

</div>
</div>

<script>
(function () {
  "use strict";

  // 本番Cloudflare Worker。ローカルでwrangler devを使ってテストする場合は
  // 一時的に "http://127.0.0.1:<port>" に変更してください（pushはしないこと）。
  var WORKER_BASE_URL = "https://shachomeshi-kpi-worker.unitedwill-uw-sales.workers.dev";
  document.getElementById("workerUrlLabel").textContent = WORKER_BASE_URL;

  var CATEGORY_LABEL = { send: "送客費", ad: "広告費", other: "その他" };
  var MONTH_LABELS = ["12月", "1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月"];

  // ---- 表示ユーティリティ ----
  function fmtYen(n) { return "¥" + Math.round(n).toLocaleString("ja-JP"); }
  function fmtInt(n) { return Math.round(n).toLocaleString("ja-JP"); }
  function fmtPct(n) { return (n * 100).toFixed(1) + "%"; }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  function showStatus(msg, kind) {
    document.getElementById("statusArea").innerHTML = '<div class="status ' + kind + '">' + esc(msg) + "</div>";
  }
  function clearStatus() { document.getElementById("statusArea").innerHTML = ""; }

  // 裏側で起きた通信エラーを記録しておき、設定＞データエラーで後から確認できるようにする
  var errorLog = [];
  function logError(context, message) {
    errorLog.unshift({ time: new Date().toISOString(), context: context, message: String(message) });
    if (errorLog.length > 50) errorLog.length = 50;
    showStatus(context + ": " + message, "err");
    if (state.page === "settings" && settingsState.tab === "data-errors") renderSettingsContent();
  }
  // fetchはHTTPエラー(4xx/5xx)でrejectしないため、r.okを見て明示的にエラー化する
  function checkResponse(r) {
    if (r.ok) return r.json();
    return r.json().catch(function () { return {}; }).then(function (body) {
      throw new Error("HTTP " + r.status + (body && body.error ? "（" + body.error + "）" : ""));
    });
  }

  // ---- 日付処理（Asia/Tokyo固定。UTCのまま月日判定しない） ----
  // Larkのタイムスタンプ(UTC ms)にJSTオフセットを足してから getUTC* で読むことで、
  // 閲覧者のブラウザのタイムゾーン設定に関係なく常にJSTとして扱う。
  function jstParts(ts) {
    var d = new Date(ts + 9 * 3600 * 1000);
    return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, day: d.getUTCDate() };
  }
  // 年度: 12/1〜翌11/30。期首年が年度名。返り値: 0=12月...11=11月 のインデックス。
  function fiscalIndex(ts, fiscalStartYear) {
    var p = jstParts(ts);
    var y = p.m === 12 ? p.y : p.y - 1; // このタイムスタンプが属する年度の期首年
    if (y !== fiscalStartYear) return null; // 対象年度の範囲外
    return p.m === 12 ? 0 : p.m;
  }
  function currentFiscalStartYear() {
    var now = new Date();
    var jst = jstParts(now.getTime() + now.getTimezoneOffset() * 60000 * 0); // ローカルnowは既にUTCms
    // new Date().getTime() はUTC msなのでそのままjstPartsに渡せる
    var p = jstParts(now.getTime());
    return p.m === 12 ? p.y : p.y - 1;
  }
  // 指定タイムスタンプが属する年度の期首年（対象年度を限定しないfiscalIndex()の汎用版）
  function fiscalStartYearOf(ts) {
    var p = jstParts(ts);
    return p.m === 12 ? p.y : p.y - 1;
  }
  // データに実在する年度の一覧（新しい順）。年度切替プルダウンの選択肢に使う。
  function listFiscalYears(sources) {
    var years = {};
    (sources.uwStudents.data || []).forEach(function (r) { if (r.registeredAt) years[fiscalStartYearOf(r.registeredAt)] = true; });
    var arr = Object.keys(years).map(Number);
    if (arr.indexOf(currentFiscalStartYear()) === -1) arr.push(currentFiscalStartYear());
    return arr.sort(function (a, b) { return b - a; });
  }
  // ルックアップ型フィールド（配列で返ってくる）を数値として正規化する。
  // 単一要素前提だが、複数要素の場合は保険として合計する。
  function numFromLookup(v) {
    if (Array.isArray(v)) return v.reduce(function (a, b) { return a + (Number(b) || 0); }, 0);
    return Number(v) || 0;
  }
  function firstFromLookup(v) { return Array.isArray(v) ? v[0] : v; }

  // 仕様書24節のステータス正規化
  var CONFIRMED_STATUSES = ["参加確定", "出席", "遅刻", "早退", "欠席"];
  var ATTENDED_STATUSES = ["出席", "遅刻", "早退"];
  var KNOWN_STATUSES = CONFIRMED_STATUSES.concat(["拒否", "学生キャンセル", "応募中"]);

  function emptyMonth() {
    return {
      regSet: new Set(),
      appCount: 0, appSet: new Set(),
      confCount: 0, confSet: new Set(),
      attCount: 0, attSet: new Set(),
      cost: 0, costBreakdown: { send: 0, ad: 0, other: 0 },
      concPeople: 0, concPeopleNet: 0, concRevenue: 0,
      channelCounts: {}
    };
  }

  // Worker生データ(JOIN前)から、年度内12ヶ月分の集計を作る
  function aggregate(sources, fiscalStartYear) {
    var months = [];
    for (var i = 0; i < 12; i++) months.push(emptyMonth());
    var unknownStatusCount = 0;

    (sources.uwStudents.data || []).forEach(function (r) {
      if (!r.registeredAt) return;
      var idx = fiscalIndex(r.registeredAt, fiscalStartYear);
      if (idx == null) return;
      months[idx].regSet.add(r.studentId);
      var ch = r.channel || "（未設定）";
      months[idx].channelCounts[ch] = (months[idx].channelCounts[ch] || 0) + 1;
    });

    (sources.applications.data || []).forEach(function (r) {
      if (r.appliedAt) {
        var ai = fiscalIndex(r.appliedAt, fiscalStartYear);
        if (ai != null) { months[ai].appCount++; months[ai].appSet.add(r.studentId); }
      }
      if (r.status && KNOWN_STATUSES.indexOf(r.status) === -1) unknownStatusCount++;
      var isConfirmed = CONFIRMED_STATUSES.indexOf(r.status) !== -1;
      var isAttended = ATTENDED_STATUSES.indexOf(r.status) !== -1;
      if (isConfirmed && r.confirmedAt) {
        var ci = fiscalIndex(r.confirmedAt, fiscalStartYear);
        if (ci != null) { months[ci].confCount++; months[ci].confSet.add(r.studentId); }
      }
      if (isAttended && r.eventDate) {
        var evi = fiscalIndex(r.eventDate, fiscalStartYear);
        if (evi != null) { months[evi].attCount++; months[evi].attSet.add(r.studentId); }
      }
    });

    (sources.costs.data || []).forEach(function (r) {
      if (!r.date) return;
      var ts = new Date(r.date + "T00:00:00+09:00").getTime();
      var idx = fiscalIndex(ts, fiscalStartYear);
      if (idx == null) return;
      var amt = Number(r.amount) || 0;
      months[idx].cost += amt;
      if (months[idx].costBreakdown[r.category] != null) months[idx].costBreakdown[r.category] += amt;
    });

    // 同時登録：開始日〜終了日の日数按分。月またぎは日数で分ける（仕様書36節）。
    (sources.simultaneousRegistrations.data || []).forEach(function (r) {
      var start = firstFromLookup(r.startAt) || r.startAt;
      var end = firstFromLookup(r.endAt) || r.endAt || start;
      if (!start) return;
      if (end < start) return; // 異常値（終了<開始）は除外
      var people = numFromLookup(r.people);
      var peopleNet = numFromLookup(r.peopleNet);
      var revenue = numFromLookup(r.revenue);
      var dayMs = 24 * 3600 * 1000;
      var days = Math.max(1, Math.round((end - start) / dayMs) + 1);
      for (var d = 0; d < days; d++) {
        var ts2 = start + d * dayMs;
        var idx2 = fiscalIndex(ts2, fiscalStartYear);
        if (idx2 == null) continue;
        months[idx2].concPeople += people / days;
        months[idx2].concPeopleNet += peopleNet / days;
        months[idx2].concRevenue += revenue / days;
      }
    });

    return { months: months, unknownStatusCount: unknownStatusCount };
  }

  // 登録月コホート集計：学生の「登録月」を基準に、その後の全期間の応募・参加確定・当日参加を
  // 累計する（発生月ではなく登録月で束ねる点が当月発生ベースと違う）。
  function buildCohortAgg(sources, fiscalStartYear) {
    var regMonthOf = {};
    (sources.uwStudents.data || []).forEach(function (r) {
      if (!r.registeredAt) return;
      var idx = fiscalIndex(r.registeredAt, fiscalStartYear);
      if (idx != null) regMonthOf[r.studentId] = idx;
    });
    var cohorts = [];
    for (var i = 0; i < 12; i++) cohorts.push({ reg: 0, appCount: 0, appSet: new Set(), confCount: 0, confSet: new Set(), attCount: 0, attSet: new Set() });
    Object.keys(regMonthOf).forEach(function (sid) { cohorts[regMonthOf[sid]].reg++; });
    (sources.applications.data || []).forEach(function (r) {
      var idx = regMonthOf[r.studentId];
      if (idx == null) return; // 学生JOIN失敗（登録データに無い）は仕様書どおりコホートから除外
      cohorts[idx].appCount++; cohorts[idx].appSet.add(r.studentId);
      if (CONFIRMED_STATUSES.indexOf(r.status) !== -1) { cohorts[idx].confCount++; cohorts[idx].confSet.add(r.studentId); }
      if (ATTENDED_STATUSES.indexOf(r.status) !== -1) { cohorts[idx].attCount++; cohorts[idx].attSet.add(r.studentId); }
    });
    return cohorts;
  }

  function totals(months, upToIdx, fromIdx) {
    var t = { reg: 0, appCount: 0, appUnique: new Set(), confCount: 0, confUnique: new Set(),
      attCount: 0, attUnique: new Set(), cost: 0, concRevenue: 0, channelCounts: {} };
    for (var i = fromIdx || 0; i <= upToIdx; i++) {
      var m = months[i];
      t.reg += m.regSet.size;
      t.appCount += m.appCount;
      m.appSet.forEach(function (v) { t.appUnique.add(v); });
      t.confCount += m.confCount;
      m.confSet.forEach(function (v) { t.confUnique.add(v); });
      t.attCount += m.attCount;
      m.attSet.forEach(function (v) { t.attUnique.add(v); });
      t.cost += m.cost;
      t.concRevenue += m.concRevenue;
      Object.keys(m.channelCounts).forEach(function (ch) { t.channelCounts[ch] = (t.channelCounts[ch] || 0) + m.channelCounts[ch]; });
    }
    return t;
  }

  function safeDiv(a, b) { return b ? a / b : null; }

  // 月別KPI目標（settings画面で入力・KV保存）を、表示対象期間で合算する
  function computeTargetTotals(targets, fiscalStartYear, upToIdx) {
    var tt = { cost: 0, reg: 0, concRevenue: 0 };
    for (var i = 0; i <= upToIdx; i++) {
      var meta = monthMeta(fiscalStartYear, i);
      var key = meta.year + "-" + String(meta.month).padStart(2, "0");
      var tm = targets[key];
      if (!tm) continue;
      tt.cost += targetCostOf(tm);
      tt.reg += tm.reg || 0;
      tt.concRevenue += targetConcRevenueOf(tm);
    }
    return tt;
  }

  // ---- 描画 ----
  var chartState = { metrics: ["reg"] };

  function renderKpis(t, tt) {
    // cost=0は「無料で獲得できた」ではなく「まだコストが未入力」を意味するため、
    // その場合はCPA系を全て「―」にする（0円やマイナスのCPAを誤解を招く形で出さない）。
    var hasCost = t.cost > 0;
    var cpaReg = hasCost ? safeDiv(t.cost, t.reg) : null;
    var cpaApp = hasCost ? safeDiv(t.cost, t.appCount) : null;
    var cpaConf = hasCost ? safeDiv(t.cost, t.confCount) : null;
    var cpaAtt = hasCost ? safeDiv(t.cost, t.attCount) : null;
    var finalCpa = hasCost && t.reg ? (t.cost - t.concRevenue) / t.reg : null;

    function achRatioColor(ratio) { return ratio >= 1 ? "var(--green)" : ratio >= 0.8 ? "#b8860b" : "var(--red)"; }
    function subCount(actual, target) {
      if (!target) return "";
      var ratio = actual / target;
      return '<div style="font-size:10.5px;font-weight:800;color:' + achRatioColor(ratio) + ';margin-top:2px;">目標 ' + fmtInt(target) + "（" + (ratio * 100).toFixed(0) + "%）</div>";
    }
    function subCpa(actual, target) {
      if (actual == null || !target) return "";
      var ratio = target / actual;
      return '<div style="font-size:10.5px;font-weight:800;color:' + achRatioColor(ratio) + ';margin-top:2px;">目標 ' + fmtYen(target) + "（" + (ratio * 100).toFixed(0) + "%）</div>";
    }
    var costSub = tt.cost ? '<div style="font-size:10.5px;color:var(--gray);margin-top:2px;">予算 ' + fmtYen(tt.cost) + "（" + ((t.cost / tt.cost) * 100).toFixed(0) + "%消化）</div>" : "";
    var cpaRegTarget = tt.reg ? tt.cost / tt.reg : 0;
    var finalCpaTarget = tt.reg ? (tt.cost - tt.concRevenue) / tt.reg : 0;

    var primaryCards = [
      { label: "費用", value: fmtYen(t.cost), sub: costSub },
      { label: "登録数", value: fmtInt(t.reg), sub: subCount(t.reg, tt.reg) },
      { label: "応募数（件数）", value: fmtInt(t.appCount) },
      { label: "参加確定数（件数）", value: fmtInt(t.confCount) },
      { label: "当日参加数（件数）", value: fmtInt(t.attCount) }
    ];
    var cpaCards = [
      { label: "登録CPA", value: cpaReg == null ? "―" : fmtYen(cpaReg), sub: subCpa(cpaReg, cpaRegTarget) },
      { label: "応募CPA", value: cpaApp == null ? "―" : fmtYen(cpaApp) },
      { label: "参加確定CPA", value: cpaConf == null ? "―" : fmtYen(cpaConf) },
      { label: "当日参加CPA", value: cpaAtt == null ? "―" : fmtYen(cpaAtt) },
      { label: "最終CPA", value: finalCpa == null ? "―" : fmtYen(finalCpa), sub: subCpa(finalCpa, finalCpaTarget) }
    ];
    function renderCardGroup(elId, cards) {
      document.getElementById(elId).innerHTML = cards.map(function (c) {
        var dim = c.value === "―" ? " dim" : "";
        return '<div class="kpi-card"><div class="kpi-label">' + esc(c.label) + '</div><div class="kpi-value' + dim + '">' + esc(c.value) + "</div>" + (c.sub || "") + "</div>";
      }).join("");
    }
    renderCardGroup("kpiGridPrimary", primaryCards);
    renderCardGroup("kpiGridCpa", cpaCards);
  }

  function renderCostRow(t) {
    document.getElementById("costRow").innerHTML =
      '<div class="cost-card"><div class="cost-label">集客コスト計</div><div class="cost-value">' + fmtYen(t.cost) + '</div></div>' +
      '<div class="cost-card"><div class="cost-label">同時登録売上</div><div class="cost-value">' + fmtYen(t.concRevenue) + '</div></div>' +
      '<div class="cost-card total"><div class="cost-label">最終コスト（費用－同時登録売上）</div><div class="cost-value">' + fmtYen(t.cost - t.concRevenue) + '</div></div>';
  }

  function renderFunnel(t) {
    var stages = [
      { name: "登録", value: t.reg },
      { name: "応募", value: t.appUnique.size },
      { name: "参加確定", value: t.confUnique.size },
      { name: "当日参加", value: t.attUnique.size }
    ];
    var html = "";
    for (var i = 0; i < stages.length; i++) {
      html += '<div class="funnel-stage"><div class="funnel-box"><div class="funnel-name">' + esc(stages[i].name) + '</div><div class="funnel-num">' + fmtInt(stages[i].value) + "</div></div></div>";
      if (i < stages.length - 1) {
        var rate = stages[i].value ? stages[i + 1].value / stages[i].value : 0;
        html += '<div class="funnel-arrow">→<br>' + fmtPct(rate) + "</div>";
      }
    }
    document.getElementById("funnelRow").innerHTML = html;
  }

  var METRIC_DEFS = [
    { key: "reg", label: "登録数", color: "#d9631e", getter: function (m) { return m.regSet.size; }, isYen: false },
    { key: "appCount", label: "応募（件数）", color: "#1e7a3d", getter: function (m) { return m.appCount; }, isYen: false },
    { key: "confCount", label: "参加確定（件数）", color: "#2d6ca8", getter: function (m) { return m.confCount; }, isYen: false },
    { key: "attCount", label: "当日参加（件数）", color: "#a4479c", getter: function (m) { return m.attCount; }, isYen: false },
    { key: "cost", label: "集客コスト", color: "#b8860b", getter: function (m) { return m.cost; }, isYen: true }
  ];

  // 月次推移グラフ本体（Dashboardと経由別内訳の両方から使う共通部品）。
  // scope で「どのグラフのボタンか」を区別し、クリック時にどのstateを更新するか決める。
  function buildTrendChartHtml(months, upToIdx, selectedMetrics, scope) {
    var buttonsHtml = METRIC_DEFS.map(function (m) {
      var active = selectedMetrics.indexOf(m.key) !== -1;
      var style = active ? "background:" + m.color + ";border-color:" + m.color + ";color:#fff;" : "";
      return '<button class="toggle-btn' + (active ? " active" : "") + '" style="' + style + '" data-chart-scope="' + scope + '" data-metric="' + m.key + '">' + esc(m.label) + "</button>";
    }).join("");

    var selected = METRIC_DEFS.filter(function (m) { return selectedMetrics.indexOf(m.key) !== -1; });
    var x0 = 50, y0 = 20, plotW = 920, plotH = 200;
    var n = upToIdx + 1;
    var xStep = n > 1 ? plotW / (n - 1) : 0;

    var allSeries = selected.map(function (m) {
      var series = [];
      for (var i = 0; i <= upToIdx; i++) series.push(m.getter(months[i]));
      return { def: m, series: series };
    });
    var max = Math.max.apply(null, [1].concat(allSeries.reduce(function (a, s) { return a.concat(s.series); }, []))) * 1.15;

    var linesHtml = "", legendHtml = "";
    allSeries.forEach(function (s) {
      var pts = s.series.map(function (v, i) {
        var x = x0 + i * xStep, y = y0 + plotH - (v / max) * plotH;
        return { x: x, y: y, v: v, label: MONTH_LABELS[i] };
      });
      var pointsAttr = pts.map(function (p) { return p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
      var dots = pts.map(function (p) {
        return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3.5" fill="' + s.def.color + '" stroke="#fff" stroke-width="1.5"><title>' + esc(s.def.label) + " " + esc(p.label) + ": " + (s.def.isYen ? fmtYen(p.v) : fmtInt(p.v)) + "</title></circle>";
      }).join("");
      linesHtml += '<polyline points="' + pointsAttr + '" fill="none" stroke="' + s.def.color + '" stroke-width="2.5"/>' + dots;
      legendHtml += '<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:11px;color:var(--gray);"><span style="width:10px;height:10px;border-radius:50%;background:' + s.def.color + ';display:inline-block;"></span>' + esc(s.def.label) + "</span>";
    });
    var xLabels = "";
    for (var i = 0; i <= upToIdx; i++) {
      xLabels += '<text x="' + (x0 + i * xStep).toFixed(1) + '" y="248" font-size="11" fill="#767676" text-anchor="middle">' + esc(MONTH_LABELS[i]) + "</text>";
    }
    return '<div class="toggle-row">' + buttonsHtml + '</div>' +
      '<div class="note" style="margin:0 0 6px;">複数選択できます（クリックで追加・解除、最低1つ）。</div>' +
      '<svg class="chart-svg" viewBox="0 0 1000 260">' + linesHtml + xLabels + '</svg>' +
      '<div style="margin-top:6px;">' + legendHtml + "</div>";
  }

  // クリックされたボタンがどのグラフのものかをdata-chart-scopeで判定し、対応するstateを更新する
  document.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-chart-scope]");
    if (!btn) return;
    var key = btn.getAttribute("data-metric");
    var scope = btn.getAttribute("data-chart-scope");
    var metricsArr = scope === "channel" ? state.channelChartMetrics : chartState.metrics;
    var idx = metricsArr.indexOf(key);
    if (idx === -1) metricsArr.push(key);
    else if (metricsArr.length > 1) metricsArr.splice(idx, 1); // 最低1つは選択状態を維持
    renderPage();
  });

  // ---- 表形式ページの共通部品 ----
  function buildTableHtml(colLabels, rows, opts) {
    opts = opts || {};
    var thead = "<tr><th></th>" + colLabels.map(function (c, i) {
      return "<th" + (opts.totalColIndex === i ? ' class="total-col"' : "") + ">" + esc(c) + "</th>";
    }).join("") + "</tr>";
    var tbody = rows.map(function (row) {
      return "<tr" + (row.isRate ? ' class="rate-row"' : row.isTotal ? ' style="font-weight:800;background:var(--accent-tint);"' : "") + "><td>" + esc(row.label) + "</td>" +
        row.cells.map(function (c, i) {
          return "<td" + (opts.totalColIndex === i ? ' class="total-col"' : "") + ">" + esc(c) + "</td>";
        }).join("") + "</tr>";
    }).join("");
    return '<div class="table-wrap"><table class="data-table"><thead>' + thead + "</thead><tbody>" + tbody + "</tbody></table></div>";
  }
  function monthCells(fn, isYen, decimals, upToIdx) {
    var cells = [];
    for (var i = 0; i < 12; i++) {
      if (i > upToIdx) { cells.push("―"); continue; }
      var v = fn(i);
      cells.push(v == null ? "―" : (isYen ? fmtYen(v) : (decimals ? v.toFixed(decimals) : fmtInt(v))));
    }
    return cells;
  }
  function rateCells(fn, upToIdx) {
    var cells = [];
    for (var i = 0; i < 12; i++) {
      if (i > upToIdx) { cells.push("―"); continue; }
      var v = fn(i);
      cells.push(v == null ? "―" : fmtPct(v));
    }
    return cells;
  }

  function renderMonthlyActualPage(months, upToIdx) {
    var rows = [
      { label: "登録数", cells: monthCells(function (i) { return months[i].regSet.size; }, false, null, upToIdx) },
      { label: "平均応募数", cells: monthCells(function (i) { return months[i].regSet.size ? months[i].appCount / months[i].regSet.size : 0; }, false, 1, upToIdx) },
      { label: "応募件数", cells: monthCells(function (i) { return months[i].appCount; }, false, null, upToIdx) },
      { label: "応募ユニーク", cells: monthCells(function (i) { return months[i].appSet.size; }, false, null, upToIdx) },
      { label: "参加確定件数", cells: monthCells(function (i) { return months[i].confCount; }, false, null, upToIdx) },
      { label: "参加確定ユニーク", cells: monthCells(function (i) { return months[i].confSet.size; }, false, null, upToIdx) },
      { label: "当日参加件数", cells: monthCells(function (i) { return months[i].attCount; }, false, null, upToIdx) },
      { label: "当日参加ユニーク", cells: monthCells(function (i) { return months[i].attSet.size; }, false, null, upToIdx) },
      { label: "投資コスト", cells: monthCells(function (i) { return months[i].cost; }, true, null, upToIdx) },
      { label: "登録CPA", cells: monthCells(function (i) { var c = months[i].cost, m = months[i].regSet.size; return c > 0 && m ? c / m : null; }, true, null, upToIdx) },
      { label: "応募CPA", cells: monthCells(function (i) { var c = months[i].cost, m = months[i].appCount; return c > 0 && m ? c / m : null; }, true, null, upToIdx) },
      { label: "参加確定CPA", cells: monthCells(function (i) { var c = months[i].cost, m = months[i].confCount; return c > 0 && m ? c / m : null; }, true, null, upToIdx) },
      { label: "当日参加CPA", cells: monthCells(function (i) { var c = months[i].cost, m = months[i].attCount; return c > 0 && m ? c / m : null; }, true, null, upToIdx) },
      { label: "同時登録人数", cells: monthCells(function (i) { return months[i].concPeople; }, false, 1, upToIdx) },
      { label: "同時登録売上", cells: monthCells(function (i) { return months[i].concRevenue; }, true, null, upToIdx) },
      { label: "最終CPA", cells: monthCells(function (i) { var c = months[i].cost, reg = months[i].regSet.size; return c > 0 && reg ? (c - months[i].concRevenue) / reg : null; }, true, null, upToIdx) },
      { label: "登録→応募率", isRate: true, cells: rateCells(function (i) { return months[i].regSet.size ? months[i].appSet.size / months[i].regSet.size : 0; }, upToIdx) },
      { label: "登録→参加確定率", isRate: true, cells: rateCells(function (i) { return months[i].regSet.size ? months[i].confSet.size / months[i].regSet.size : 0; }, upToIdx) },
      { label: "応募→参加確定率", isRate: true, cells: rateCells(function (i) { return months[i].appSet.size ? months[i].confSet.size / months[i].appSet.size : 0; }, upToIdx) },
      { label: "登録→当日参加率", isRate: true, cells: rateCells(function (i) { return months[i].regSet.size ? months[i].attSet.size / months[i].regSet.size : 0; }, upToIdx) },
      { label: "参加確定→当日参加率", isRate: true, cells: rateCells(function (i) { return months[i].confSet.size ? months[i].attSet.size / months[i].confSet.size : 0; }, upToIdx) }
    ];
    return '<div class="note">掲載数はイベントマスタ未接続のため省略しています。表示対象の月より先は実績がまだ無いため「―」表示です。</div>' + buildTableHtml(MONTH_LABELS, rows);
  }

  function renderRoiPage(months, upToIdx) {
    var cols = MONTH_LABELS.concat(["合計"]);
    function rowWithTotal(label, fn, isCount) {
      var cells = [], total = 0;
      for (var i = 0; i < 12; i++) {
        if (i > upToIdx) { cells.push("―"); continue; }
        var v = fn(i); total += v;
        cells.push(isCount ? fmtInt(v) : fmtYen(v));
      }
      cells.push(isCount ? fmtInt(total) : fmtYen(total));
      return { label: label, cells: cells };
    }
    var rows = [
      rowWithTotal("送客費", function (i) { return months[i].costBreakdown.send; }),
      rowWithTotal("広告費", function (i) { return months[i].costBreakdown.ad; }),
      rowWithTotal("その他", function (i) { return months[i].costBreakdown.other; }),
      rowWithTotal("集客コスト計", function (i) { return months[i].cost; }),
      rowWithTotal("同時登録売上", function (i) { return months[i].concRevenue; }),
      rowWithTotal("登録数", function (i) { return months[i].regSet.size; }, true)
    ];
    var cpaRegCells = [], finalCpaCells = [];
    for (var i = 0; i < 12; i++) {
      if (i > upToIdx) { cpaRegCells.push("―"); finalCpaCells.push("―"); continue; }
      var c = months[i].cost, reg = months[i].regSet.size;
      cpaRegCells.push(c > 0 && reg ? fmtYen(c / reg) : "―");
      finalCpaCells.push(c > 0 && reg ? fmtYen((c - months[i].concRevenue) / reg) : "―");
    }
    cpaRegCells.push("―"); finalCpaCells.push("―"); // 合計列のCPAは出さない
    rows.push({ label: "登録CPA", cells: cpaRegCells });
    rows.push({ label: "最終CPA", cells: finalCpaCells });
    return '<div class="note">合計は表示対象月までの累計です。</div>' + buildTableHtml(cols, rows, { totalColIndex: 12 });
  }

      { label: "応募→参加確定率", isRate: true, cells: rateCells(function (i) { return cohorts[i].appSet.size ? cohorts[i].confSet.size / cohorts[i].appSet.size : 0; }, upToIdx) },

      { label: "参加確定→当日参加率", isRate: true, cells: rateCells(function (i) { return cohorts[i].confSet.size ? cohorts[i].attSet.size / cohorts[i].confSet.size : 0; }, upToIdx) },

    ];
    return '<div class="note">応募・参加確定・当日参加は「その月に登録した学生」のその後全期間の累計です（発生月ではなく登録月で束ねています）。コストは登録月自身の投資コストをそのまま割り当てており、学生ごとの按分ではありません。</div>' + buildTableHtml(cols, rows);
