  function renderAnnualPage(months, upToIdx, channelMode) {
    var cumApp = 0, cumConf = 0;
    var cumAppArr = [], cumConfArr = [];
    for (var i = 0; i < 12; i++) {
      if (i <= upToIdx) { cumApp += months[i].appCount; cumConf += months[i].confCount; }
      cumAppArr.push(i <= upToIdx ? cumApp : null);
      cumConfArr.push(i <= upToIdx ? cumConf : null);
    }
    var rows = [
      { label: "費用", cells: monthCells(function (i) { return months[i].cost; }, true, null, upToIdx) },
      { label: "登録", cells: monthCells(function (i) { return months[i].regSet.size; }, false, null, upToIdx) },
      { label: "応募件数", cells: monthCells(function (i) { return months[i].appCount; }, false, null, upToIdx) },
      { label: "応募ユニーク", cells: monthCells(function (i) { return months[i].appSet.size; }, false, null, upToIdx) },
      { label: "参加確定件数", cells: monthCells(function (i) { return months[i].confCount; }, false, null, upToIdx) },
      { label: "参加確定ユニーク", cells: monthCells(function (i) { return months[i].confSet.size; }, false, null, upToIdx) },
      { label: "当日参加件数", cells: monthCells(function (i) { return months[i].attCount; }, false, null, upToIdx) },
      { label: "当日参加ユニーク", cells: monthCells(function (i) { return months[i].attSet.size; }, false, null, upToIdx) },
      { label: "登録CPA", cells: monthCells(function (i) { var c = months[i].cost, m = months[i].regSet.size; return c > 0 && m ? c / m : null; }, true, null, upToIdx) },
      { label: "応募CPA", cells: monthCells(function (i) { var c = months[i].cost, m = months[i].appCount; return c > 0 && m ? c / m : null; }, true, null, upToIdx) },
      { label: "参加確定CPA", cells: monthCells(function (i) { var c = months[i].cost, m = months[i].confCount; return c > 0 && m ? c / m : null; }, true, null, upToIdx) },
      { label: "当日参加CPA", cells: monthCells(function (i) { var c = months[i].cost, m = months[i].attCount; return c > 0 && m ? c / m : null; }, true, null, upToIdx) }
    ];
    if (!channelMode) rows.push({ label: "最終CPA", cells: monthCells(function (i) { var c = months[i].cost, reg = months[i].regSet.size; return c > 0 && reg ? (c - months[i].concRevenue) / reg : null; }, true, null, upToIdx) });
    rows.push(
      { label: "UU", cells: monthCells(function (i) { return months[i].regSet.size; }, false, null, upToIdx) },
      { label: "総応募（累計）", cells: cumAppArr.map(function (v) { return v == null ? "―" : fmtInt(v); }) },
      { label: "総参加（累計）", cells: cumConfArr.map(function (v) { return v == null ? "―" : fmtInt(v); }) }
    );
    if (!channelMode) rows.push({ label: "同時登録売上", cells: monthCells(function (i) { return months[i].concRevenue; }, true, null, upToIdx) });
    var note = "UUは暫定値として登録数と同値。総応募・総参加は年度開始（12月）からの累計。" +
      (channelMode ? " 経由選択時の費用・CPAは、コスト実績の「経由」欄が一致するものだけを集計しています。最終CPA・同時登録売上は経由に紐付けられないため非表示です。" : "");
    return '<div class="note">' + note + '</div>' + buildTableHtml(MONTH_LABELS, rows);
  }

  var MC_METRICS = [
    { key: "cost", label: "費用", isYen: true, higherBetter: null },
    { key: "reg", label: "登録数", isYen: false, higherBetter: true },
    { key: "appCount", label: "応募数", isYen: false, higherBetter: true },
    { key: "confCount", label: "参加確定数", isYen: false, higherBetter: true },
    { key: "attCount", label: "当日参加数", isYen: false, higherBetter: true },
    { key: "cpaReg", label: "登録CPA", isYen: true, higherBetter: false, cpa: true },
    { key: "cpaApp", label: "応募CPA", isYen: true, higherBetter: false, cpa: true },
    { key: "cpaConf", label: "参加確定CPA", isYen: true, higherBetter: false, cpa: true },
    { key: "cpaAtt", label: "当日参加CPA", isYen: true, higherBetter: false, cpa: true },
    { key: "finalCpa", label: "最終CPA", isYen: true, higherBetter: false, cpa: true }
  ];
  function metricValue(months, idx, key) {
    if (idx == null || idx < 0 || idx > 11) return null;
    var m = months[idx];
    if (!m) return null;
    if (key === "cost") return m.cost;
    if (key === "reg") return m.regSet.size;
    if (key === "appCount") return m.appCount;
    if (key === "confCount") return m.confCount;
    if (key === "attCount") return m.attCount;
    if (key === "cpaReg") return m.cost > 0 && m.regSet.size ? m.cost / m.regSet.size : null;
    if (key === "cpaApp") return m.cost > 0 && m.appCount ? m.cost / m.appCount : null;
    if (key === "cpaConf") return m.cost > 0 && m.confCount ? m.cost / m.confCount : null;
    if (key === "cpaAtt") return m.cost > 0 && m.attCount ? m.cost / m.attCount : null;
    if (key === "finalCpa") return m.cost > 0 && m.regSet.size ? (m.cost - m.concRevenue) / m.regSet.size : null;
    return null;
  }
  // 月間管理: 前年同月・前月・当月・翌月の4枚カードを並べる。当月カードにだけ前月比・前年同月比の両方を出す。
  function renderMonthComparePage(months, upToIdx, centerIdx, channelMode, priorYearMonths) {
    var metrics = channelMode ? MC_METRICS.filter(function (m) { return m.key !== "finalCpa"; }) : MC_METRICS;

    function diffLine(v, base, metric, prefix) {
      var diff = v - base;
      var pct = base ? diff / base : null;
      var improved = metric.higherBetter === null ? null : (metric.higherBetter ? diff > 0 : diff < 0);
      var color = improved === null || diff === 0 ? "var(--gray)" : (improved ? "var(--accent)" : "var(--red)");
      var sign = diff > 0 ? "+" : "";
      return '<div style="font-size:10.5px;color:' + color + ';">' + prefix + sign + (metric.isYen ? fmtYen(diff) : fmtInt(diff)) + (pct != null ? " (" + sign + (pct * 100).toFixed(1) + "%)" : "") + "</div>";
    }
    // getMomBase/getYoyBaseはnull可（比較対象が無い場合）。invalidReasonがあればカード全体を「データ無し」表示にする。
    function buildCard(label, highlight, getValue, getMomBase, getYoyBase, invalidReason) {
      var html = '<div class="card" style="margin-bottom:0;' + (highlight ? "border-color:var(--accent);background:var(--accent-tint);" : "") + '">';
      html += '<div style="font-size:12.5px;font-weight:800;margin-bottom:8px;">' + label + "</div>";
      if (invalidReason) {
        html += '<div class="note" style="margin:0;">' + esc(invalidReason) + "</div>";
      } else {
        metrics.forEach(function (metric) {
          var v = getValue(metric.key);
          var valueText = v == null ? "―" : (metric.isYen ? fmtYen(v) : fmtInt(v));
          var subHtml = "";
          if (v != null && getMomBase) {
            var pv = getMomBase(metric.key);
            if (pv != null) subHtml += diffLine(v, pv, metric, "");
          }
          if (v != null && getYoyBase) {
            var yv = getYoyBase(metric.key);
            if (yv != null) subHtml += diffLine(v, yv, metric, "前年同月比 ");
          }
          html += '<div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--border);padding:6px 0;">' +
            '<span style="font-size:11px;color:var(--gray);">' + esc(metric.label) + "</span>" +
            '<span style="text-align:right;"><div style="font-weight:800;font-size:13px;">' + esc(valueText) + "</div>" + subHtml + "</span></div>";
        });
      }
      html += "</div>";
      return html;
    }

    var cardsHtml = "";
    if (priorYearMonths) {
      cardsHtml += buildCard("前年同月　" + esc(MONTH_LABELS[centerIdx]), false,
        function (key) { return metricValue(priorYearMonths, centerIdx, key); }, null, null, null);
    } else {
      cardsHtml += buildCard("前年同月", false, null, null, null, "前年度のデータがありません");
    }
    var idxs = [centerIdx - 1, centerIdx, centerIdx + 1];
    var colNames = ["前月", "当月", "翌月"];
    for (var c = 0; c < 3; c++) {
      var idx = idxs[c];
      var valid = idx >= 0 && idx <= upToIdx;
      var label = esc(colNames[c]) + "　" + (idx >= 0 && idx <= 11 ? esc(MONTH_LABELS[idx]) : "");
      if (!valid) {
        cardsHtml += buildCard(label, c === 1, null, null, null, idx > upToIdx ? "まだ実績がありません" : "年度範囲外です");
        continue;
      }
      var prevIdx = idx - 1;
      var hasPrev = prevIdx >= 0 && prevIdx <= upToIdx;
      var isCurrent = c === 1;
      cardsHtml += buildCard(
        label, isCurrent,
        function (key) { return metricValue(months, idx, key); },
        hasPrev ? function (key) { return metricValue(months, prevIdx, key); } : null,
        (isCurrent && priorYearMonths) ? function (key) { return metricValue(priorYearMonths, centerIdx, key); } : null,
        null
      );
    }
    var html = '<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);">' + cardsHtml + "</div>";
    var note = "対象月セレクターで選んだ月を「当月」として、前年同月・前月・翌月と比較します（当月カードには前月比・前年同月比の両方を表示）。" +
      (channelMode ? " 経由選択時の費用・CPAは、コスト実績の「経由」欄が一致するものだけを集計しています。最終CPAは経由に紐付けられないため非表示です。" : "");
    return '<div class="note">' + note + '</div>' + html;
  }

  function monthMeta(fiscalStartYear, idx) {
    return idx === 0 ? { year: fiscalStartYear, month: 12 } : { year: fiscalStartYear + 1, month: idx };
  }
  function buildDailyAgg(sources, year, month) {
    var daysInMonth = new Date(year, month, 0).getDate();
    var days = [];
    for (var d = 0; d < daysInMonth; d++) days.push({ regCount: 0, appCount: 0, appSet: new Set(), confCount: 0, confSet: new Set(), attCount: 0, attSet: new Set() });
    function dayIdx(ts) {
      var p = jstParts(ts);
      if (p.y === year && p.m === month) return p.day - 1;
      return null;
    }
    (sources.uwStudents.data || []).forEach(function (r) {
      if (!r.registeredAt) return;
      var di = dayIdx(r.registeredAt);
      if (di != null) days[di].regCount++;
    });
    (sources.applications.data || []).forEach(function (r) {
      if (r.appliedAt) { var ai = dayIdx(r.appliedAt); if (ai != null) { days[ai].appCount++; days[ai].appSet.add(r.studentId); } }
      var isConfirmed = CONFIRMED_STATUSES.indexOf(r.status) !== -1;
      var isAttended = ATTENDED_STATUSES.indexOf(r.status) !== -1;
      if (isConfirmed && r.confirmedAt) { var ci = dayIdx(r.confirmedAt); if (ci != null) { days[ci].confCount++; days[ci].confSet.add(r.studentId); } }
      if (isAttended && r.eventDate) { var ei = dayIdx(r.eventDate); if (ei != null) { days[ei].attCount++; days[ei].attSet.add(r.studentId); } }
    });
    return { daysInMonth: daysInMonth, days: days };
  }
  function renderDailyPage(sources, fiscalStartYear, months, centerIdx) {
    var meta = monthMeta(fiscalStartYear, centerIdx);
    var mo = months[centerIdx];
    var da = buildDailyAgg(sources, meta.year, meta.month);
    var n = da.daysInMonth;
    var costPerDay = mo.cost / n, peoplePerDay = mo.concPeople / n, revenuePerDay = mo.concRevenue / n;

    function isOff(d) { var dow = new Date(meta.year, meta.month - 1, d).getDay(); return dow === 0 || dow === 6; }
    function buildRow(label, arr, isYen, decimals, totalOverride) {
      var cells = arr.map(function (v) { return isYen ? fmtYen(v) : (decimals ? v.toFixed(decimals) : fmtInt(v)); });
      var total = totalOverride !== undefined ? totalOverride : arr.reduce(function (a, b) { return a + b; }, 0);
      cells.push(isYen ? fmtYen(total) : (decimals ? total.toFixed(decimals) : fmtInt(total)));
      return { label: label, cells: cells };
    }
    var rows = [
      buildRow("登録数", da.days.map(function (x) { return x.regCount; }), false),
      buildRow("応募件数", da.days.map(function (x) { return x.appCount; }), false),
      buildRow("応募ユニーク", da.days.map(function (x) { return x.appSet.size; }), false),
      buildRow("参加確定件数", da.days.map(function (x) { return x.confCount; }), false),
      buildRow("参加確定ユニーク", da.days.map(function (x) { return x.confSet.size; }), false),
      buildRow("当日参加件数", da.days.map(function (x) { return x.attCount; }), false),
      buildRow("当日参加ユニーク", da.days.map(function (x) { return x.attSet.size; }), false),
      buildRow("コスト日割り", da.days.map(function () { return costPerDay; }), true, null, mo.cost),
      buildRow("同時登録人数日割り", da.days.map(function () { return peoplePerDay; }), false, 1, mo.concPeople),
      buildRow("同時登録売上日割り", da.days.map(function () { return revenuePerDay; }), true, null, mo.concRevenue)
    ];
    var cols = [];
    for (var d = 1; d <= n; d++) cols.push(meta.month + "/" + d);
    cols.push("月合計");
    var thead = "<tr><th></th>" + cols.map(function (c, i) {
      var isTotal = i === cols.length - 1;
      var off = !isTotal && isOff(i + 1);
      return "<th" + (isTotal ? ' class="total-col"' : off ? ' style="background:#f2f0ec;"' : "") + ">" + esc(c) + "</th>";
    }).join("") + "</tr>";
    var tbody = rows.map(function (row) {
      return "<tr><td>" + esc(row.label) + "</td>" + row.cells.map(function (c, i) {
        var isTotal = i === row.cells.length - 1;
        var off = !isTotal && isOff(i + 1);
        return "<td" + (isTotal ? ' class="total-col"' : off ? ' style="background:#f7f5f2;"' : "") + ">" + esc(c) + "</td>";
      }).join("") + "</tr>";
    }).join("");
    var table = '<div class="table-wrap"><table class="data-table"><thead>' + thead + "</thead><tbody>" + tbody + "</tbody></table></div>";
    return '<div class="note">' + meta.year + "年" + meta.month + "月の日別実績（土日はグレー背景。祝日判定は未実装）。コスト・同時登録は月間実績を日数で均等割りした参考値です。</div>" + table;
  }

  // データに実在する卒業年度の一覧（①UW学生リストの「卒業年度」フィールドから）
  function listGraduationYears(sources) {
    var counts = {};
    (sources.uwStudents.data || []).forEach(function (r) {
      if (r.graduationYear) counts[r.graduationYear] = (counts[r.graduationYear] || 0) + 1;
    });
    return Object.keys(counts).sort();
  }
  // 卒業年度で学生を絞り込んだ「sources」を作る（他の集計関数はこれを渡せばそのまま卒業年度フィルタが効く）。
  // 「全体」なら元のsourcesをそのまま返す（コピーコスト無し）。
  function filterSourcesByGraduationYear(sources, gradYear) {
    if (!gradYear || gradYear === "__all__") return sources;
    var allowedIds = {};
    (sources.uwStudents.data || []).forEach(function (r) { if (r.graduationYear === gradYear) allowedIds[r.studentId] = true; });
    function filterArr(arr, idField) { return (arr || []).filter(function (r) { return allowedIds[r[idField]]; }); }
    return {
      uwStudents: Object.assign({}, sources.uwStudents, { data: filterArr(sources.uwStudents.data, "studentId") }),
      applications: Object.assign({}, sources.applications, { data: filterArr(sources.applications.data, "studentId") }),
      shukatsuMeshi: Object.assign({}, sources.shukatsuMeshi, { data: filterArr(sources.shukatsuMeshi.data, "studentKey") }),
      simultaneousRegistrations: sources.simultaneousRegistrations, // 学生個人に紐付かないため対象外
      costs: sources.costs
    };
  }
  function graduationYearFilterSelectHtml(id, years, current) {
    var opts = '<option value="__all__"' + (current === "__all__" ? " selected" : "") + '>全学年</option>' +
      years.map(function (y) { return '<option value="' + esc(y) + '"' + (y === current ? " selected" : "") + ">" + esc(y) + "</option>"; }).join("");
    return '<div class="row" style="max-width:320px;"><label>卒業年度</label><select id="graduationYearSelect">' + opts + "</select></div>";
  }

  // 学生ID→経由 の対応表（①UW学生リストの「経由」フィールドから）
  function buildChannelOfMap(sources) {
    var channelOf = {};
    (sources.uwStudents.data || []).forEach(function (r) { channelOf[r.studentId] = r.channel || "（未設定）"; });
    return channelOf;
  }
  function listChannels(sources) {
    var counts = {};
    (sources.uwStudents.data || []).forEach(function (r) {
      var ch = r.channel || "（未設定）";
      counts[ch] = (counts[ch] || 0) + 1;
    });
    return Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
  }
  // 経由フィルタ用プルダウン（「全体」＋各経由）。年間管理・月間管理・経由別内訳で共用。
  function channelFilterSelectHtml(id, channels, current) {
    var opts = '<option value="__all__"' + (current === "__all__" ? " selected" : "") + '>全体（経由合計）</option>' +
      channels.map(function (ch) { return '<option value="' + esc(ch) + '"' + (ch === current ? " selected" : "") + ">" + esc(ch) + "</option>"; }).join("");
    return '<div class="row" style="max-width:320px;"><label>経由</label><select id="' + id + '">' + opts + "</select></div>";
  }
  // 選択した経由だけに絞った月別集計（登録は「経由」で直接、応募/参加確定/当日参加は
  // 学生ID経由でJOINして絞り込む。①UW学生リストに存在しない学生は仕様どおり除外）
  function aggregateByChannel(sources, fiscalStartYear, channel) {
    var months = [];
    for (var i = 0; i < 12; i++) months.push(emptyMonth());
    var channelOf = buildChannelOfMap(sources);

    (sources.uwStudents.data || []).forEach(function (r) {
      if (!r.registeredAt || (r.channel || "（未設定）") !== channel) return;
      var idx = fiscalIndex(r.registeredAt, fiscalStartYear);
      if (idx != null) months[idx].regSet.add(r.studentId);
    });
    (sources.applications.data || []).forEach(function (r) {
      if (channelOf[r.studentId] !== channel) return;
      if (r.appliedAt) { var ai = fiscalIndex(r.appliedAt, fiscalStartYear); if (ai != null) { months[ai].appCount++; months[ai].appSet.add(r.studentId); } }
      var isConfirmed = CONFIRMED_STATUSES.indexOf(r.status) !== -1;
      var isAttended = ATTENDED_STATUSES.indexOf(r.status) !== -1;
      if (isConfirmed && r.confirmedAt) { var ci = fiscalIndex(r.confirmedAt, fiscalStartYear); if (ci != null) { months[ci].confCount++; months[ci].confSet.add(r.studentId); } }
      if (isAttended && r.eventDate) { var evi = fiscalIndex(r.eventDate, fiscalStartYear); if (evi != null) { months[evi].attCount++; months[evi].attSet.add(r.studentId); } }
    });
    // コスト実績の「経由」欄が選択中の経由と完全一致するものだけを積み上げる（一致しないもの・未設定は含めない）
    (sources.costs.data || []).forEach(function (r) {
      if (!r.date || r.channel !== channel) return;
      var ts = new Date(r.date + "T00:00:00+09:00").getTime();
      var idx = fiscalIndex(ts, fiscalStartYear);
      if (idx == null) return;
      var amt = Number(r.amount) || 0;
      months[idx].cost += amt;
      if (months[idx].costBreakdown[r.category] != null) months[idx].costBreakdown[r.category] += amt;
    });
    return months;
  }

  // 経由×指標の比較表（指定した月レンジ[fromIdx, toIdx]の累計で、全経由を横並びに比較する）
  function buildChannelCompareTable(sources, fiscalStartYear, channels, fromIdx, toIdx) {
    var cols = ["登録数", "応募数", "参加確定数", "当日参加数", "費用", "登録CPA", "応募CPA", "参加確定CPA", "当日参加CPA"];
    var rows = channels.map(function (ch) {
      var chMonths = aggregateByChannel(sources, fiscalStartYear, ch);
      var t = totals(chMonths, toIdx, fromIdx);
      var hasCost = t.cost > 0;
      var cpaReg = hasCost ? safeDiv(t.cost, t.reg) : null;
      var cpaApp = hasCost ? safeDiv(t.cost, t.appCount) : null;
      var cpaConf = hasCost ? safeDiv(t.cost, t.confCount) : null;
      var cpaAtt = hasCost ? safeDiv(t.cost, t.attCount) : null;
      return {
        label: ch,
        cells: [
          fmtInt(t.reg), fmtInt(t.appCount), fmtInt(t.confCount), fmtInt(t.attCount), fmtYen(t.cost),
          cpaReg == null ? "―" : fmtYen(cpaReg),
          cpaApp == null ? "―" : fmtYen(cpaApp),
          cpaConf == null ? "―" : fmtYen(cpaConf),
          cpaAtt == null ? "―" : fmtYen(cpaAtt)
        ]
      };
    });
    return '<div class="note">費用・CPAは、コスト実績の「経由」欄がその経由と一致するものだけを集計した参考値です。</div>' + buildTableHtml(cols, rows);
  }

  function renderChannelPage(sources, fiscalStartYear, upToIdx) {
    var channels = listChannels(sources);
    if (channels.length === 0) return '<div class="note">データがありません。</div>';
    if (!state.channelFilter || channels.indexOf(state.channelFilter) === -1) state.channelFilter = channels[0];

    var selectHtml = '<div class="row" style="max-width:320px;"><label>経由</label><select id="channelFilterSelect">' +
      channels.map(function (ch) { return '<option value="' + esc(ch) + '"' + (ch === state.channelFilter ? " selected" : "") + ">" + esc(ch) + "</option>"; }).join("") +
      "</select></div>" +
      graduationYearFilterSelectHtml("graduationYearSelect", listGraduationYears(lastAgg.rawSources), state.graduationYearFilter);

    var chMonths = aggregateByChannel(sources, fiscalStartYear, state.channelFilter);
    var t = totals(chMonths, upToIdx);
    var hasCost = t.cost > 0;
    var cpaReg = hasCost ? safeDiv(t.cost, t.reg) : null;
    var cpaApp = hasCost ? safeDiv(t.cost, t.appCount) : null;
    var cpaConf = hasCost ? safeDiv(t.cost, t.confCount) : null;
    var cpaAtt = hasCost ? safeDiv(t.cost, t.attCount) : null;

    function kpiCardsHtml(cards, cols) {
      return '<div class="kpi-grid" style="grid-template-columns:repeat(' + cols + ',1fr);">' + cards.map(function (c) {
        var dim = c.value === "―" ? " dim" : "";
        return '<div class="kpi-card"><div class="kpi-label">' + esc(c.label) + '</div><div class="kpi-value' + dim + '">' + esc(c.value) + "</div></div>";
      }).join("") + "</div>";
    }
    var kpiHtml = kpiCardsHtml([
      { label: "費用", value: fmtYen(t.cost) },
      { label: "登録数", value: fmtInt(t.reg) },
      { label: "応募数（件数）", value: fmtInt(t.appCount) },
      { label: "参加確定数（件数）", value: fmtInt(t.confCount) },
      { label: "当日参加数（件数）", value: fmtInt(t.attCount) }
    ], 5) + '<div class="kpi-group-label">CPA（この経由にコスト実績で紐付けられた費用のみ）</div>' + kpiCardsHtml([
      { label: "登録CPA", value: cpaReg == null ? "―" : fmtYen(cpaReg) },
      { label: "応募CPA", value: cpaApp == null ? "―" : fmtYen(cpaApp) },
      { label: "参加確定CPA", value: cpaConf == null ? "―" : fmtYen(cpaConf) },
      { label: "当日参加CPA", value: cpaAtt == null ? "―" : fmtYen(cpaAtt) }
    ], 4);

    var chartHtml = buildTrendChartHtml(chMonths, upToIdx, state.channelChartMetrics, "channel");

    var funnelStages = [
      { name: "登録", value: t.reg }, { name: "応募", value: t.appUnique.size },
      { name: "参加確定", value: t.confUnique.size }, { name: "当日参加", value: t.attUnique.size }
    ];
    var funnelHtml = '<div class="funnel">';
    for (var i = 0; i < funnelStages.length; i++) {
      funnelHtml += '<div class="funnel-stage"><div class="funnel-box"><div class="funnel-name">' + esc(funnelStages[i].name) + '</div><div class="funnel-num">' + fmtInt(funnelStages[i].value) + "</div></div></div>";
      if (i < funnelStages.length - 1) {
        var rate = funnelStages[i].value ? funnelStages[i + 1].value / funnelStages[i].value : 0;
        funnelHtml += '<div class="funnel-arrow">→<br>' + fmtPct(rate) + "</div>";
      }
    }
    funnelHtml += "</div>";

    // 参考：経由×月のクロス集計表（費用はCPAとして経由別に紐付けできないため件数のみ）
    var cols = MONTH_LABELS.concat(["合計"]);

    var totalByChannel = {};
    for (var i2 = 0; i2 <= upToIdx; i2++) {
      var mSrc = lastAgg.agg.months[i2];
      Object.keys(mSrc.channelCounts).forEach(function (ch) { totalByChannel[ch] = (totalByChannel[ch] || 0) + mSrc.channelCounts[ch]; });
    }
    var tableRows = channels.map(function (ch) {
      var cells = [], total = 0;
      for (var i = 0; i < 12; i++) {
        if (i > upToIdx) { cells.push("―"); continue; }
        var v = lastAgg.agg.months[i].channelCounts[ch] || 0;
        total += v;
        cells.push(fmtInt(v));
      }
      cells.push(fmtInt(total));
      return { label: ch, cells: cells };
    });
    var totalCells = [], grandTotal = 0;
    for (var i3 = 0; i3 < 12; i3++) {
      if (i3 > upToIdx) { totalCells.push("―"); continue; }
      var monthTotal = Object.keys(lastAgg.agg.months[i3].channelCounts).reduce(function (a, ch) { return a + lastAgg.agg.months[i3].channelCounts[ch]; }, 0);
      grandTotal += monthTotal;
      totalCells.push(fmtInt(monthTotal));
    }
    totalCells.push(fmtInt(grandTotal));
    tableRows.push({ label: "合計", cells: totalCells, isTotal: true });

    return '<div class="note">登録は「経由」フィールドで、応募・参加確定・当日参加は学生IDのJOINで同じ経由に絞り込んでいます。費用・CPAは、コスト実績の「経由」欄が選択中の経由と一致するものだけを集計した参考値です（最終CPAは同時登録売上を経由に紐付けられないため対象外）。</div>' +
      selectHtml +
      '<div class="kpi-group-label">選択中の経由：' + esc(state.channelFilter) + "（年度累計）</div>" + kpiHtml +
      '<div class="kpi-group-label">月次推移</div>' + chartHtml +
      '<div class="kpi-group-label">ファネル</div>' + funnelHtml +
      '<div class="kpi-group-label">登録数：経由×月の内訳（参考）</div>' +
      buildTableHtml(cols, tableRows, { totalColIndex: 12 }) +
      '<div class="kpi-group-label" style="margin-top:18px;">経由比較（年度累計）</div>' +
      buildChannelCompareTable(sources, fiscalStartYear, channels, 0, upToIdx);
  }

  // ---- ページナビゲーション ----
  var NAV_PAGES = [
    { key: "dashboard", label: "Dashboard" },
    { key: "channel", label: "経由別内訳" },
    { key: "monthly-actual", label: "当月発生ベース" },
    { key: "roi", label: "集客ROI" },
    { key: "cohort", label: "登録月ベース（コホート）" },
    { key: "annual", label: "年間管理" },
    { key: "month-compare", label: "月間管理" },
    { key: "daily", label: "デイリー実績" },
    { key: "settings", label: "設定" }
  ];
  var state = {
    page: "dashboard", centerIdx: null, targets: {}, channelFilter: null, channelChartMetrics: ["reg"],
    annualChannelFilter: "__all__", monthCompareChannelFilter: "__all__",
    fiscalStartYear: null, graduationYearFilter: "__all__"
  };
  var lastAgg = null; // { sources, fiscalStartYear, agg, upToIdx }

  function renderNav() {
    document.getElementById("navRow").innerHTML = NAV_PAGES.map(function (p) {
      return '<button class="nav-btn' + (state.page === p.key ? " active" : "") + '" data-page="' + p.key + '">' + esc(p.label) + "</button>";
    }).join("");
  }
  document.getElementById("navRow").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-page]");
    if (!btn) return;
    state.page = btn.getAttribute("data-page");
    renderPage();
  });

  document.getElementById("monthSelector").addEventListener("change", function (e) {
    state.centerIdx = parseInt(e.target.value, 10);
    renderPage();
  });

  document.getElementById("tablePageContent").addEventListener("change", function (e) {
    var id = e.target.id;
    if (id === "channelFilterSelect") { state.channelFilter = e.target.value; renderPage(); }
    else if (id === "annualChannelSelect") { state.annualChannelFilter = e.target.value; renderPage(); }
    else if (id === "monthCompareChannelSelect") { state.monthCompareChannelFilter = e.target.value; renderPage(); }
  });
  // 卒業年度プルダウンはDashboard（#dashboardGraduationYearRow）と表形式ページ（#tablePageContent）の
  // 両方に出現するため、document全体でイベント委譲して1箇所で処理する。
  document.addEventListener("change", function (e) {
    if (e.target.id !== "graduationYearSelect") return;
    state.graduationYearFilter = e.target.value;
    renderDashboard(lastSources);
  });

  function showEl(id, show) { document.getElementById(id).style.display = show ? "" : "none"; }

  var NEEDS_SELECTOR = { "month-compare": true, daily: true };
  var PAGE_TITLES = {
    "monthly-actual": "当月発生ベース", roi: "集客ROI", cohort: "登録月ベース（コホート）",
    annual: "年間管理", "month-compare": "月間管理", daily: "デイリー実績", channel: "経由別内訳"
  };

  function renderPage() {
    if (!lastAgg) return;
    renderNav();
    var isDashboard = state.page === "dashboard";
    var isSettings = state.page === "settings";
    var isTablePage = !isDashboard && !isSettings;
    showEl("dashboardCard", isDashboard);
    showEl("costSummaryCard", isDashboard);
    showEl("chartCard", isDashboard);
    showEl("funnelCard", isDashboard);
    showEl("tablePageCard", isTablePage);
    showEl("settingsCard", isSettings);

    var months = lastAgg.agg.months, upToIdx = lastAgg.upToIdx;
    if (state.centerIdx == null) state.centerIdx = upToIdx;

    if (isDashboard) {
      document.getElementById("dashboardGraduationYearRow").innerHTML =
        graduationYearFilterSelectHtml("graduationYearSelect", listGraduationYears(lastAgg.rawSources), state.graduationYearFilter);
      var t = totals(months, upToIdx);
      var tt = computeTargetTotals(state.targets || {}, lastAgg.fiscalStartYear, upToIdx);
      renderKpis(t, tt);
      renderCostRow(t);
      renderFunnel(t);
      document.getElementById("chartCardBody").innerHTML = buildTrendChartHtml(months, upToIdx, chartState.metrics, "dashboard");
      return;
    }
    if (isSettings) { renderSettingsContent(); return; }

    document.getElementById("tablePageTitle").textContent = PAGE_TITLES[state.page] || "";
    // 経由/卒業年度プルダウンを自前で表示しないページでは、卒業年度で絞り込み中であることを一言添える
    // （プルダウン自体は経由別内訳・年間管理・月間管理にしか置いていないため、他ページでの絞り込み漏れ誤解を防ぐ）
    var PAGES_WITHOUT_OWN_FILTER_UI = { "monthly-actual": true, roi: true, cohort: true, daily: true };
    if (PAGES_WITHOUT_OWN_FILTER_UI[state.page] && state.graduationYearFilter !== "__all__") {
      document.getElementById("activeFilterNote").textContent = "卒業年度「" + state.graduationYearFilter + "」で絞り込み中です。";
      showEl("activeFilterNote", true);
    } else {
      showEl("activeFilterNote", false);
    }
    var showSelector = !!NEEDS_SELECTOR[state.page];
    showEl("monthSelectorRow", showSelector);
    if (showSelector) {
      var sel = document.getElementById("monthSelector");
      var optsHtml = "";
      for (var i = 0; i <= upToIdx; i++) optsHtml += '<option value="' + i + '"' + (i === state.centerIdx ? " selected" : "") + ">" + esc(MONTH_LABELS[i]) + "</option>";
      sel.innerHTML = optsHtml;
    }

    if (state.page === "monthly-actual") {
      document.getElementById("tablePageContent").innerHTML = renderMonthlyActualPage(months, upToIdx);
    } else if (state.page === "roi") {
      document.getElementById("tablePageContent").innerHTML = renderRoiPage(months, upToIdx);
    } else if (state.page === "cohort") {
      document.getElementById("tablePageContent").innerHTML = renderCohortPage(lastAgg.sources, lastAgg.fiscalStartYear, months, upToIdx);
    } else if (state.page === "annual") {
      var annualChannels = listChannels(lastAgg.sources);
      var annualFiltered = state.annualChannelFilter !== "__all__" && annualChannels.indexOf(state.annualChannelFilter) !== -1;
      if (!annualFiltered) state.annualChannelFilter = "__all__";
      var annualMonths = annualFiltered ? aggregateByChannel(lastAgg.sources, lastAgg.fiscalStartYear, state.annualChannelFilter) : months;
      var annualCompareHtml = annualChannels.length === 0 ? "" :
        '<div class="kpi-group-label" style="margin-top:18px;">経由比較（年度累計）</div>' +
        buildChannelCompareTable(lastAgg.sources, lastAgg.fiscalStartYear, annualChannels, 0, upToIdx);
      document.getElementById("tablePageContent").innerHTML =
        channelFilterSelectHtml("annualChannelSelect", annualChannels, state.annualChannelFilter) +
        graduationYearFilterSelectHtml("graduationYearSelect", listGraduationYears(lastAgg.rawSources), state.graduationYearFilter) +
        renderAnnualPage(annualMonths, upToIdx, annualFiltered) +
        annualCompareHtml;
    } else if (state.page === "month-compare") {
      var mcChannels = listChannels(lastAgg.sources);
      var mcFiltered = state.monthCompareChannelFilter !== "__all__" && mcChannels.indexOf(state.monthCompareChannelFilter) !== -1;
      if (!mcFiltered) state.monthCompareChannelFilter = "__all__";
      var mcMonths = mcFiltered ? aggregateByChannel(lastAgg.sources, lastAgg.fiscalStartYear, state.monthCompareChannelFilter) : months;
      // 前年同月比較用に、前年度分も同じ絞り込み条件（経由・卒業年度）で集計する
      var priorFiscalYear = lastAgg.fiscalStartYear - 1;
      var priorYearAvailable = listFiscalYears(lastAgg.rawSources).indexOf(priorFiscalYear) !== -1;
      var priorYearMonths = priorYearAvailable
        ? (mcFiltered ? aggregateByChannel(lastAgg.sources, priorFiscalYear, state.monthCompareChannelFilter) : aggregate(lastAgg.sources, priorFiscalYear).months)
        : null;
      var mcCompareHtml = mcChannels.length === 0 ? "" :
        '<div class="kpi-group-label" style="margin-top:18px;">経由比較（' + esc(MONTH_LABELS[state.centerIdx]) + '）</div>' +
        buildChannelCompareTable(lastAgg.sources, lastAgg.fiscalStartYear, mcChannels, state.centerIdx, state.centerIdx);
      document.getElementById("tablePageContent").innerHTML =
        channelFilterSelectHtml("monthCompareChannelSelect", mcChannels, state.monthCompareChannelFilter) +
        graduationYearFilterSelectHtml("graduationYearSelect", listGraduationYears(lastAgg.rawSources), state.graduationYearFilter) +
        renderMonthComparePage(mcMonths, upToIdx, state.centerIdx, mcFiltered, priorYearMonths) +
        mcCompareHtml;
    } else if (state.page === "daily") {
      document.getElementById("tablePageContent").innerHTML = renderDailyPage(lastAgg.sources, lastAgg.fiscalStartYear, months, state.centerIdx);
    } else if (state.page === "channel") {
      document.getElementById("tablePageContent").innerHTML = renderChannelPage(lastAgg.sources, lastAgg.fiscalStartYear, upToIdx);
    }
  }

  // 年度セレクタ（サイドバー、全ページ共通）。データに実在する年度を新しい順に並べる。
  function renderYearSelector(rawSources) {
    var years = listFiscalYears(rawSources);
    document.getElementById("fiscalYearCard").style.display = "";
    document.getElementById("fiscalYearSelect").innerHTML = years.map(function (y) {
      return '<option value="' + y + '"' + (y === state.fiscalStartYear ? " selected" : "") + ">" + y + "年度</option>";
    }).join("");
  }
  document.getElementById("fiscalYearSelect").addEventListener("change", function (e) {
    state.fiscalStartYear = parseInt(e.target.value, 10);
    state.centerIdx = null; // 年度が変わると月の範囲も変わるため選択中の月をリセット
    renderDashboard(lastSources);
  });

  function renderDashboard(rawSources) {
    if (state.fiscalStartYear == null) state.fiscalStartYear = currentFiscalStartYear();
    var fiscalStartYear = state.fiscalStartYear;
    renderYearSelector(rawSources);

    var sources = filterSourcesByGraduationYear(rawSources, state.graduationYearFilter);
    var agg = aggregate(sources, fiscalStartYear);
    // 「現在存在するデータのうち、最も新しい月」までを表示対象にする
    var upToIdx = 0;
    for (var i = 0; i < 12; i++) {
      var m = agg.months[i];
      if (m.regSet.size || m.appCount || m.confCount || m.attCount || m.cost) upToIdx = i;
    }
    lastAgg = { sources: sources, rawSources: rawSources, fiscalStartYear: fiscalStartYear, agg: agg, upToIdx: upToIdx };

    document.getElementById("fiscalYearLabel").textContent = fiscalStartYear + "年度（" + fiscalStartYear + "/12〜" + (fiscalStartYear + 1) + "/11）";
    var noteParts = [];
    if (agg.unknownStatusCount > 0) noteParts.push("未知の参加ステータス：" + agg.unknownStatusCount + "件（集計から除外）");
    if (state.graduationYearFilter !== "__all__") noteParts.push("卒業年度「" + state.graduationYearFilter + "」で絞り込み中（経由別内訳・年間管理・月間管理ページの卒業年度プルダウンから変更できます）");
    noteParts.push("目標値はまだ設定できる仕組みがないため実績のみ表示。イベント種別分類はイベントマスタ未接続のため今回は省略。");
    document.getElementById("dashboardNote").textContent = noteParts.join(" / ");

    renderPage();
  }

  // ---- 設定画面 ----
  var SETTINGS_TABS = [
    { key: "fiscal", label: "年度設定" },
    { key: "refresh", label: "更新" },
    { key: "targets", label: "月別KPI目標" },
    { key: "event-targets", label: "イベント種別目標" },
    { key: "event-master", label: "イベントマスタ" },
    { key: "field-mapping", label: "Larkフィールドマッピング" },
    { key: "data-errors", label: "データエラー" },
    { key: "costs", label: "コスト実績" }
  ];
  var settingsState = { tab: "fiscal", fieldMapping: null };
  var lastSources = null;
  var lastFetchedAt = null, lastCacheHit = null;
  var manualRefreshState = { date: null, used: 0, limit: 3, remaining: 3, busy: false };

  function renderManualRefreshTab() {
    var admin = document.getElementById("adminToggle").checked;
    var m = manualRefreshState;
    var lastStr = "―";
    if (lastFetchedAt) {
      var t = new Date(lastFetchedAt);
      lastStr = t.getFullYear() + "/" + (t.getMonth() + 1) + "/" + t.getDate() + " " + String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0");
    }
    var canClick = admin && m.remaining > 0 && !m.busy;
    var btnLabel = m.busy ? "更新中..." : "今すぐ更新";
    var noteText = !admin ? "手動更新には管理者モードが必要です。"
      : m.remaining > 0 ? "本日はあと" + m.remaining + "回、手動更新できます（自動更新は6時間おきに別途動いています）。"
      : "本日の手動更新回数（" + m.limit + "回）を使い切りました。日付が変わるとリセットされます。";
    return '<div class="note">Larkの最新データを今すぐ取得し直します（キャッシュ更新）。自動更新は1日4回、6時間おきに裏側で動いています。</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">' +
      '<div><div style="font-size:12.5px;">最終更新: ' + esc(lastStr) + '</div>' +
      '<div class="note" style="margin:4px 0 0;">' + esc(noteText) + '</div></div>' +
      '<button data-action="manual-refresh"' + (canClick ? "" : " disabled") + '>' + esc(btnLabel) + '</button>' +
      '</div>' +
      '<div class="note" style="margin-top:6px;">本日の使用回数: ' + m.used + '/' + m.limit + (m.date ? "（" + esc(m.date) + "）" : "") + '</div>';
  }

  function monthKeyOf(fiscalStartYear, idx) {
    var meta = monthMeta(fiscalStartYear, idx);
    return meta.year + "-" + String(meta.month).padStart(2, "0");
  }

  function renderSettingsTabs() {
    document.getElementById("settingsTabRow").innerHTML = SETTINGS_TABS.map(function (t) {
      return '<button class="toggle-btn' + (settingsState.tab === t.key ? " active" : "") + '" data-settings-tab="' + t.key + '">' + esc(t.label) + "</button>";
    }).join("");
  }

  function renderFiscalTab() {
    var y = lastAgg.fiscalStartYear;
    return '<div class="note">年度は12/1〜翌11/30の固定ルールです（編集不可）。現在日付から自動判定されます。</div>' +
      '<div class="row"><label>現在の年度</label><div>' + y + "年度（" + y + "/12〜" + (y + 1) + "/11）</div></div>";
  }

  // 費用目標＝登録人数×1人当たりのコスト、同時登録売上目標＝登録人数×同時登録率×平均単価×社数、
  // という積み上げ式で入力してもらい、費用・売上そのものは自動計算する（直接入力はさせない）。
  function targetCostOf(tm) { return (tm.reg || 0) * (tm.costPerReg || 0); }
  function targetConcRevenueOf(tm) { return (tm.reg || 0) * ((tm.concurrentRate || 0) / 100) * (tm.avgUnitPrice || 0) * (tm.companyCount || 0); }

  function renderTargetsTab() {
    var admin = document.getElementById("adminToggle").checked;
    var y = lastAgg.fiscalStartYear;
    var t = state.targets || {};
    function inputCell(idx, field, step) {
      var key = monthKeyOf(y, idx);
      var v = (t[key] && t[key][field]) || 0;
      return '<input type="number" class="target-input" style="width:100px;" value="' + v + '" step="' + step + '" min="0" data-month="' + idx + '" data-field="' + field + '"' + (admin ? "" : " disabled") + ">";
    }
    var thead = '<tr><th></th><th class="total-col">合計</th>' + MONTH_LABELS.map(function (l) { return "<th>" + esc(l) + "</th>"; }).join("") + "</tr>";
    function sumField(field) {
      var s = 0;
      for (var i = 0; i < 12; i++) { var tm = t[monthKeyOf(y, i)]; if (tm) s += tm[field] || 0; }
      return s;
    }
    // 率・単価の行は12ヶ月分を足しても意味が無いため、合計欄は「―」にする（opts.sumTotalで明示的に指定した行だけ合計を出す）
    function row(label, field, step, opts) {
      opts = opts || {};
      var cells = "";
      for (var i = 0; i < 12; i++) cells += "<td>" + inputCell(i, field, step) + "</td>";
      var totalCell = opts.sumTotal
        ? '<td class="total-col">' + fmtInt(sumField(field)) + "</td>"
        : '<td class="total-col" style="color:var(--gray);">―</td>';
      return "<tr><td>" + esc(label) + "</td>" + totalCell + cells + "</tr>";
    }
    function computedRow(label, fn) {
      var cells = "", total = 0;
      for (var i = 0; i < 12; i++) {
        var tm = t[monthKeyOf(y, i)] || {};
        var v = fn(tm);
        total += v;
        cells += "<td>" + fmtYen(v) + "</td>";
      }
      return '<tr class="rate-row"><td>' + esc(label) + '</td><td class="total-col">' + fmtYen(total) + "</td>" + cells + "</tr>";
    }
    var tbody =
      row("登録目標（人）", "reg", 1, { sumTotal: true }) +
      row("1人当たりのコスト目標（¥）", "costPerReg", 100) +
      computedRow("→ 費用目標（自動計算）", targetCostOf) +
      row("同時登録率目標（%）", "concurrentRate", 0.1) +
      row("平均単価目標（¥）", "avgUnitPrice", 1000) +
      row("社数目標（社）", "companyCount", 1, { sumTotal: true }) +
      computedRow("→ 同時登録売上目標（自動計算）", targetConcRevenueOf);
    return '<div class="note">' + (admin ? "編集するとDashboardの達成率に即時反映されます（フォーカスを外すと自動保存）。費用目標＝登録目標×1人当たりのコスト、同時登録売上目標＝登録目標×同時登録率×平均単価×社数、で自動計算されます。「合計」は年度12ヶ月分の単純合計です（率・単価の行は合計の意味が無いため「―」表示）。" : "編集するには管理者モードをONにしてください。") + "</div>" +
      '<div class="table-wrap"><table class="data-table targets-table"><thead>' + thead + "</thead><tbody>" + tbody + "</tbody></table></div>";
  }

  function renderEventTargetsTab() {
    return '<div class="note">イベントマスタが未接続のため、イベント種別ごとの目標設定はまだ利用できません。イベントマスタを接続した後に対応します。</div>';
  }
  function renderEventMasterTab() {
    return '<div class="note">イベントマスタはまだ接続していません（検討中のため保留中です）。接続が決まり次第、掲載数・開催回数の集計に反映します。</div>';
  }

  function renderFieldMappingTab() {
    if (!settingsState.fieldMapping) {
      fetch(WORKER_BASE_URL + "/api/field-mapping").then(checkResponse).then(function (json) {
        settingsState.fieldMapping = json.data || {};
        if (state.page === "settings" && settingsState.tab === "field-mapping") renderSettingsContent();
      }).catch(function (err) { logError("Larkフィールドマッピング取得", err.message); });
      return '<div class="note">読み込み中...</div>';
    }
    var html = "";
    Object.keys(settingsState.fieldMapping).forEach(function (key) {
      var src = settingsState.fieldMapping[key];
      html += '<div class="card" style="margin-bottom:10px;"><div style="font-weight:800;font-size:12.5px;margin-bottom:6px;">' + esc(key) + "</div>" +
        '<div class="note" style="margin:0 0 4px;">appToken: ' + esc(src.appToken) + " ／ tableId: " + esc(src.tableId) + "</div>" +
        '<div class="note" style="margin:0;">fields: ' + esc(JSON.stringify(src.fields)) + "</div></div>";
    });
    return '<div class="note">実際に接続しているField ID一覧です（読み取り専用。編集はWorker側のコードで行います。App Secret等の機密情報はここには出しません）。</div>' + html;
  }

  function renderDataErrorsTab() {
    var agg = lastAgg.agg;
    var registeredIds = {};
    (lastSources.uwStudents.data || []).forEach(function (r) { if (r.studentId) registeredIds[r.studentId] = true; });
    var joinFailCount = 0;
    (lastSources.applications.data || []).forEach(function (r) { if (r.studentId && !registeredIds[r.studentId]) joinFailCount++; });
    var rows = [
      { type: "未知の参加ステータス", count: agg.unknownStatusCount, example: "参加状況が「参加確定/出席/遅刻/早退/欠席/拒否/学生キャンセル/応募中」以外の値" },
      { type: "学生JOIN失敗", count: joinFailCount, example: "応募データの学生IDが①UW学生リストに存在しない（コホート集計からは除外、通常の応募・参加実績には残す）" },
      { type: "①UW学生リスト：学生ID欠落", count: (lastSources.uwStudents && lastSources.uwStudents.skipped) || 0, example: "アプリ登録UIDが空の行。Worker側で集計対象から除外済み（別人が1人にまとまるのを防ぐため）" },
      { type: "⑥UW個社応募者：学生ID欠落", count: (lastSources.applications && lastSources.applications.skipped) || 0, example: "学生IDが空の行。Worker側で集計対象から除外済み" }
    ];
    var dataQualityHtml = '<div class="note">個人情報は表示しません。異常データのみ除外し、正常データは通常どおり集計します。</div>' +
      rows.map(function (r) {
        return '<div class="card" style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;"><div style="font-weight:800;font-size:12.5px;">' + esc(r.type) + '</div><div style="font-weight:800;color:' + (r.count > 0 ? "var(--red)" : "var(--green)") + ';">' + fmtInt(r.count) + "件</div></div>" +
          '<div class="note" style="margin:6px 0 0;">' + esc(r.example) + "</div></div>";
      }).join("");

    var errorLogHtml = '<h2 style="margin-top:18px;">直近の通信エラー <span style="font-weight:400;color:var(--gray);font-size:11px;">（このブラウザを開いてから発生したもの、最大50件）</span></h2>';
    if (errorLog.length === 0) {
      errorLogHtml += '<div class="note" style="margin:0;">今のところエラーはありません。</div>';
    } else {
      errorLogHtml += '<button class="ghost" data-action="clear-error-log" style="margin-bottom:10px;">ログをクリア</button><table><thead><tr><th>時刻</th><th>操作</th><th>内容</th></tr></thead><tbody>' +
        errorLog.map(function (e) {
          var t = new Date(e.time);
          var timeStr = t.getFullYear() + "/" + (t.getMonth() + 1) + "/" + t.getDate() + " " + String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0") + ":" + String(t.getSeconds()).padStart(2, "0");
          return "<tr><td>" + esc(timeStr) + "</td><td>" + esc(e.context) + "</td><td>" + esc(e.message) + "</td></tr>";
        }).join("") + "</tbody></table>";
    }
    return dataQualityHtml + errorLogHtml;
  }

  function renderCostsTab() {
    var admin = document.getElementById("adminToggle").checked;
    var list = (lastSources.costs && lastSources.costs.data) || [];
    var channelOpts = listChannels(lastSources);
    var formHtml = !admin ? "" :
      '<div class="card" style="margin-bottom:10px;"><h2>コスト実績を追加</h2>' +
      '<div class="row"><label>日付</label><input type="date" id="f_date"></div>' +
      '<div class="row"><label>コストのかけ方</label><input type="text" id="f_method" placeholder="例：Instagram広告"></div>' +
      '<div class="row"><label>経由</label><select id="f_channel"><option value="">（全体・特定経由なし）</option>' +
      channelOpts.map(function (ch) { return '<option value="' + esc(ch) + '">' + esc(ch) + "</option>"; }).join("") +
      '</select></div>' +
      '<div class="row"><label>分類</label><select id="f_category"><option value="send">送客費</option><option value="ad">広告費</option><option value="other">その他</option></select></div>' +
      '<div class="row"><label>金額（円）</label><input type="number" id="f_amount" min="0" step="1"></div>' +
      '<div class="note">経由を選ぶと、経由別内訳・年間管理・月間管理の経由別表示にこの費用がCPAとして反映されます。特定の経由に絞れない費用は「全体・特定経由なし」のままにしてください（全体の集計には含まれます）。</div>' +
      '<button data-action="add-cost">追加</button></div>';
    var rowsHtml = list.length === 0 ? '<tr><td colspan="6" style="color:var(--gray);">まだデータがありません</td></tr>' :
      list.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); }).map(function (e) {
        return "<tr><td>" + esc(e.date) + "</td><td>" + esc(CATEGORY_LABEL[e.category] || e.category) + "</td><td>" + esc(e.method) +
          "</td><td>" + esc(e.channel || "―") + "</td><td>" + fmtYen(e.amount) + "</td><td>" +
          (admin ? '<button class="ghost" data-del="' + esc(e.id) + '">削除</button>' : "") + "</td></tr>";
      }).join("");
    var statusRows = Object.keys(lastSources).map(function (key) {
      var s = lastSources[key];
      return "<tr><td>" + esc(key) + "</td><td>" + esc(s.status) + "</td><td>" + esc(s.count) + "</td></tr>";
    }).join("");
    return formHtml +
      '<div class="card"><h2>コスト実績一覧</h2><table><thead><tr><th>日付</th><th>分類</th><th>コストのかけ方</th><th>経由</th><th>金額</th><th></th></tr></thead><tbody>' + rowsHtml + "</tbody></table></div>" +
      '<div class="card"><h2>/api/data 取得状況（参考）</h2><table><thead><tr><th>ソース</th><th>状態</th><th>件数</th></tr></thead><tbody>' + statusRows + "</tbody></table></div>";
  }

  function renderSettingsContent() {
    renderSettingsTabs();
    var html = "";
    if (settingsState.tab === "fiscal") html = renderFiscalTab();
    else if (settingsState.tab === "refresh") html = renderManualRefreshTab();
    else if (settingsState.tab === "targets") html = renderTargetsTab();
    else if (settingsState.tab === "event-targets") html = renderEventTargetsTab();
    else if (settingsState.tab === "event-master") html = renderEventMasterTab();
    else if (settingsState.tab === "field-mapping") html = renderFieldMappingTab();
    else if (settingsState.tab === "data-errors") html = renderDataErrorsTab();
    else if (settingsState.tab === "costs") html = renderCostsTab();
    document.getElementById("settingsTabContent").innerHTML = html;
  }

  document.getElementById("settingsTabRow").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-settings-tab]");
    if (!btn) return;
    settingsState.tab = btn.getAttribute("data-settings-tab");
    renderSettingsContent();
  });

  document.getElementById("adminToggle").addEventListener("change", function (e) {
    document.getElementById("adminBarLabel").textContent = "管理者モード：" + (e.target.checked ? "ON（編集可能）" : "OFF（閲覧のみ）");
    if (state.page === "settings") renderSettingsContent();
  });

  document.getElementById("settingsTabContent").addEventListener("click", function (e) {
    var clearLogBtn = e.target.closest('[data-action="clear-error-log"]');
    if (clearLogBtn) { errorLog.length = 0; renderSettingsContent(); return; }
    var refreshBtn = e.target.closest('[data-action="manual-refresh"]');
    if (refreshBtn) {
      if (manualRefreshState.busy || manualRefreshState.remaining <= 0) return;
      manualRefreshState.busy = true;
      renderSettingsContent();
      fetch(WORKER_BASE_URL + "/api/refresh", { method: "POST" })
        .then(checkResponse)
        .then(function (json) {
          manualRefreshState.busy = false;
          if (json.manualRefresh) manualRefreshState = Object.assign({ busy: false }, json.manualRefresh);
          lastSources = json.sources || lastSources;
          lastFetchedAt = json.fetchedAt || lastFetchedAt;
          lastCacheHit = json.cacheHit;
          renderDashboard(lastSources); // renderPage()経由で設定タブも再描画される
          showStatus("手動更新が完了しました。", "ok");
        })
        .catch(function (err) {
          manualRefreshState.busy = false;
          renderSettingsContent();
          logError("手動更新", err.message);
        });
      return;
    }
    var addBtn = e.target.closest('[data-action="add-cost"]');
    if (addBtn) {
      var body = {
        date: document.getElementById("f_date").value,
        method: document.getElementById("f_method").value,
        channel: document.getElementById("f_channel").value,
        category: document.getElementById("f_category").value,
        amount: document.getElementById("f_amount").value
      };
      if (!body.date || !body.amount) { showStatus("日付と金額は必須です。", "err"); return; }
      showStatus("追加中...", "loading");
      fetch(WORKER_BASE_URL + "/api/costs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
        .then(checkResponse)
        .then(function (json) {
          if (json.status === "success") loadAll();
          else logError("コスト追加", json.error || "不明なエラー");
        })
        .catch(function (err) { logError("コスト追加", err.message); });
      return;
    }
    var delBtn = e.target.closest("[data-del]");
    if (delBtn) {
      var id = delBtn.getAttribute("data-del");
      if (!confirm("この行を削除しますか？")) return;
      fetch(WORKER_BASE_URL + "/api/costs?id=" + encodeURIComponent(id), { method: "DELETE" })
        .then(checkResponse)
        .then(function () { loadAll(); })
        .catch(function (err) { logError("コスト削除", err.message); });
    }
  });

  document.getElementById("settingsTabContent").addEventListener("change", function (e) {
    var el = e.target.closest(".target-input");
    if (!el) return;
    var idx = parseInt(el.getAttribute("data-month"), 10);
    var monthKey = monthKeyOf(lastAgg.fiscalStartYear, idx);
    var wrap = document.getElementById("settingsTabContent");
    function get(field) {
      var i = wrap.querySelector('.target-input[data-month="' + idx + '"][data-field="' + field + '"]');
      return i ? i.value : 0;
    }
    var body = {
      monthKey: monthKey, reg: get("reg"), costPerReg: get("costPerReg"),
      concurrentRate: get("concurrentRate"), avgUnitPrice: get("avgUnitPrice"), companyCount: get("companyCount")
    };
    fetch(WORKER_BASE_URL + "/api/targets", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(checkResponse)
      .then(function () {
        state.targets[monthKey] = {
          reg: Number(body.reg) || 0, costPerReg: Number(body.costPerReg) || 0,
          concurrentRate: Number(body.concurrentRate) || 0, avgUnitPrice: Number(body.avgUnitPrice) || 0,
          companyCount: Number(body.companyCount) || 0
        };
        renderPage(); // 設定タブの自動計算行・Dashboardの達成率どちらも再描画される
      })
      .catch(function (err) { logError("目標の保存", err.message); });
  });

  function loadAll() {
    showStatus("読み込み中...", "loading");
    return Promise.all([
      fetch(WORKER_BASE_URL + "/api/data").then(checkResponse),
      fetch(WORKER_BASE_URL + "/api/targets").then(checkResponse).catch(function (err) { logError("目標値取得", err.message); return { data: {} }; }),
      fetch(WORKER_BASE_URL + "/api/refresh").then(checkResponse).catch(function (err) { logError("手動更新の残り回数取得", err.message); return null; })
    ]).then(function (results) {
      lastSources = results[0].sources || {};
      lastFetchedAt = results[0].fetchedAt || null;
      lastCacheHit = results[0].cacheHit;
      state.targets = results[1].data || {};
      if (results[2] && results[2].manualRefresh) manualRefreshState = Object.assign({ busy: false }, results[2].manualRefresh);
      Object.keys(lastSources).forEach(function (key) {
        var s = lastSources[key];
        if (s.status === "error") logError("データ取得（" + key + "）", s.message || s.errorCode || "不明なエラー");
      });
      renderDashboard(lastSources);
      clearStatus();
    }).catch(function (err) { logError("/api/data 取得", err.message); });
  }

  loadAll();
})();
</script>
</body>
</html>
